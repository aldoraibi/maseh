<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1200px;height:630px;overflow:hidden;
  background:
    radial-gradient(760px 420px at 78% -60px, rgba(59,130,246,.30), transparent 70%),
    linear-gradient(160deg,#10141c,#080a0f);
  color:#eef1f6;
  font-family:'thmanyah sans','IBM Plex Sans Arabic',sans-serif;
  display:flex;align-items:center;gap:56px;padding:0 70px;
}
.left{flex:1}
.row{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.row img{width:98px;height:98px;border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
h1{font-size:76px;font-weight:700;letter-spacing:-1.5px;line-height:1}
p.tag{font-size:31px;line-height:1.55;color:#c3ccdb;margin-bottom:30px;max-width:640px}
ul{list-style:none;display:flex;flex-wrap:wrap;gap:11px;margin-bottom:34px}
li{font-size:22px;color:#cfd8e6;background:rgba(255,255,255,.07);
   border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 20px}
.url{font-size:25px;color:#7fb2ff;font-family:ui-monospace,Menlo,monospace;direction:ltr;text-align:right}
.shot{width:300px;border-radius:20px;border:1px solid rgba(255,255,255,.13);
      box-shadow:0 30px 70px rgba(0,0,0,.6)}
</style>
</head>
<body>
  <div class="left">
    <div class="row">
      <img src="icon.png" alt="">
      <h1>الماسح</h1>
    </div>
    <p class="tag">شغّل الماسح الضوئي في طابعة Canon PIXMA من الماك — بدون برامج كانون.</p>
    <ul>
      <li>مسح متعدد الصفحات</li>
      <li>OCR عربي</li>
      <li>قوالب صور</li>
      <li>طباعة</li>
    </ul>
    <div class="url">aldoraibi.github.io/maseh</div>
  </div>
  <img class="shot" src="screenshot.png" alt="">
</body>
</html>
